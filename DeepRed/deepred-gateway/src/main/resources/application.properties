spring.application.name=deepred-gateway
server.port=8080

deepred.id=DeepRed
deepred.gateway.address=http://deepred-gateway:8080/

backend.service.address=http://backend:8080
backend.service.aistatus.api=/board/ai/setstatus
backend.service.makemove.api=/board/ai/makemove

engine.service.address=http://deepred-engine:8080
engine.service.evaluate.api=/evaluate

gateway.packet.count=3
gateway.safety.margin.ms=100
gateway.engine.margin.ms=50
gateway.register.retry.delay.ms=2000
