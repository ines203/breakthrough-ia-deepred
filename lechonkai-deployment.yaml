apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: lechonkai
  name: lechonkai
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: lechonkai
  template:
    metadata:
      labels:
        io.kompose.service: lechonkai
    spec:
      containers:
        - image: breakthrough_lechonkai-image
          name: lechonkai
          imagePullPolicy: Never 
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
